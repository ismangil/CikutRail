; CikutRail turnout controller
;
;   pio run -e stamp-s3bat -t upload     build and flash over USB-C
;   pio device monitor -e stamp-s3bat    serial console
;   pio test -e native                   unit tests on the PC

[platformio]
default_envs = stamp-s3bat

[env:stamp-s3bat]
; Arduino-ESP32 2.0.17 (ESP-IDF 4.4)
platform = espressif32@6.9.0
; The Stamp-S3Bat has the same flash layout (8 MB) as the Stamp-S3.
; Its PSRAM is left unused.
board = m5stack-stamps3
framework = arduino
lib_deps =
    https://github.com/m5stack/M5PM1.git#1.0.7
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_flags =
    -Wall
    -Wextra
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++11
    -Wall
    -Wextra
