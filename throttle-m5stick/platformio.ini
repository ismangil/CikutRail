; CikutRail M5Stick throttle
;
;   pio run -e m5stick-c-plus2 -t upload     build and flash over USB-C
;   pio device monitor -e m5stick-c-plus2    serial console

[platformio]
default_envs = m5stick-c-plus2

[env:m5stick-c-plus2]
platform = espressif32@6.9.0
board = m5stick-c-plus2
framework = arduino
lib_deps =
    m5stack/M5Unified@0.2.25
    https://github.com/flash62au/WiThrottleProtocol.git#v1.1.27
    symlink://../throttle-common
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_flags =
    -Wall
    -Wextra
monitor_speed = 115200
upload_speed = 1500000
