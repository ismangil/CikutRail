; CikutRail touch-screen throttle (Waveshare ESP32-S3-Touch-LCD-3.49)
;
;   pio run -e touch349 -t upload     build and flash over USB-C
;   pio device monitor -e touch349    serial console
;   pio test -e native                unit tests on the PC

[platformio]
default_envs = touch349

[env:touch349]
; Arduino-ESP32 3.x (Arduino_GFX needs it); the stock platform stops at 2.0.17
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
test_ignore = *
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
framework = arduino
board_build.arduino.memory_type = qio_opi
lib_deps =
    moononournation/GFX Library for Arduino@1.6.8
    https://github.com/flash62au/WiThrottleProtocol.git#v1.1.27
    symlink://../throttle-common
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
build_src_flags =
    -Wall
    -Wextra
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++11
    -Wall
    -Wextra
    -I../throttle-common/src
    -Isrc
